springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
  show-actuator: false
  remove-broken-reference-definitions: true

management:
  endpoints:
    web:
      exposure:
        include: '*' #openapi, swagger-ui, health
  endpoint:
    health:
      show-details: always
