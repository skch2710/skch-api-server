plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.skch'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

/*
configurations {
    implementation {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}
*/

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Dependencies
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
  	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    //implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Utility Libraries
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:32.1.3-jre'

    // File Processing
    implementation 'com.github.pjfanning:excel-streaming-reader:5.0.2'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'com.itextpdf:itextpdf:5.5.13'
    implementation 'com.opencsv:opencsv:5.7.1'

    // SMB Connection
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.7'
    
    //SMARTY
    implementation 'com.smartystreets.api:smartystreets-java-sdk:3.17.5'

    // Swagger (OpenAPI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

    // Object Mapping and Annotations
    implementation 'org.mapstruct:mapstruct:1.5.2.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.2.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test Dependencies
    /*
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
  	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
  	testImplementation 'org.springframework.boot:spring-boot-starter-freemarker-test'
  	testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
  	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
  	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
  	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  	testCompileOnly 'org.projectlombok:lombok'
  	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  	testAnnotationProcessor 'org.projectlombok:lombok'
  	*/
}

